name: Build WDA ipa

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Bootstrap WDA dependencies
        run: ./Scripts/bootstrap.sh -d

      - name: Build WebDriverAgentRunner for generic iOS device (unsigned)
        run: |
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Package as .ipa
        run: |
          set -e
          APP_PATH=$(find build/Build/Products -maxdepth 2 -name "WebDriverAgentRunner-Runner.app" | head -n1)
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r WebDriverAgentRunner.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgentRunner
          path: WebDriverAgentRunner.ipa
